<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экскурсия — Синяя птица</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app order-page">

    <!-- Back button -->
    <div class="order-back-row">
      <button class="order-back-btn" onclick="history.back()">
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 1L1 7l6 6"/></svg>
        <span>Назад</span>
      </button>
    </div>

    <!-- Title -->
    <h1 class="order-title">Запись на экскурсию<br><em>в «Синюю птицу»</em></h1>

    <!-- Selected barber -->
    <div class="booking-barber" id="selectedBarber">
      <div class="booking-empty">Педагог — по желанию. Его можно выбрать отдельно в разделе «Педагоги».</div>
    </div>

    <!-- Service selection -->
    <section class="service-picker" aria-labelledby="servicePickerTitle">
      <div class="service-picker-heading">
        <span class="eyebrow">ШАГ 1 / ФОРМАТ</span>
        <h2 id="servicePickerTitle">Как хотите<br><em>познакомиться с садом?</em></h2>
        <p class="order-helper">Обычно выбирают экскурсию по саду. Если у вас есть конкретный вопрос, можно сразу выбрать встречу по поступлению или адаптации.</p>
      </div>
      <div class="service-choice-grid" id="serviceChoices">
        <button class="service-choice" type="button" data-service-id="1" data-service-name="Экскурсия по саду" data-service-price="0" data-service-label="по записи" data-service-image="/images/bluebird/workshop-wide.jpg">
          <span class="service-choice-image"><img src="/images/bluebird/workshop-wide.jpg" alt="Экскурсия по саду" loading="lazy" /></span>
          <span class="service-choice-copy"><strong>Экскурсия по саду</strong><small>по записи</small></span><span class="service-choice-check">✓</span>
        </button>
        <button class="service-choice" type="button" data-service-id="2" data-service-name="Знакомство с руководителем" data-service-price="0" data-service-label="по записи" data-service-image="/images/bluebird/workshop.jpg">
          <span class="service-choice-image"><img src="/images/bluebird/workshop.jpg" alt="Знакомство с руководителем" loading="lazy" /></span>
          <span class="service-choice-copy"><strong>Знакомство с руководителем</strong><small>по записи</small></span><span class="service-choice-check">✓</span>
        </button>
        <button class="service-choice" type="button" data-service-id="3" data-service-name="Консультация по адаптации" data-service-price="0" data-service-label="по записи" data-service-image="/images/bluebird/activity-beads.jpg">
          <span class="service-choice-image"><img src="/images/bluebird/activity-beads.jpg" alt="Консультация по адаптации" loading="lazy" /></span>
          <span class="service-choice-copy"><strong>Консультация по адаптации</strong><small>по записи</small></span><span class="service-choice-check">✓</span>
        </button>
        <button class="service-choice" type="button" data-service-id="4" data-service-name="Встреча по поступлению" data-service-price="0" data-service-label="по записи" data-service-image="/images/bluebird/classroom.jpg">
          <span class="service-choice-image"><img src="/images/bluebird/classroom.jpg" alt="Встреча по поступлению" loading="lazy" /></span>
          <span class="service-choice-copy"><strong>Встреча по поступлению</strong><small>по записи</small></span><span class="service-choice-check">✓</span>
        </button>
      </div>
    </section>

    <!-- Selected service summary -->
    <div class="order-items" id="orderItems" aria-live="polite"></div>

    <!-- Form -->
    <div class="order-form-card">
      <form class="order-form" id="orderForm">
        <div class="order-field"><label>Ваше имя</label><input type="text" name="name" placeholder="Как к вам обращаться?" required /></div>
        <div class="order-field"><label>Телефон</label><input type="tel" name="phone" placeholder="+996" required maxlength="15" /></div>
        <div class="order-field"><label>Желаемая дата и время экскурсии</label><input type="text" name="time" placeholder="Например, в субботу после 11:00" required /></div>
        <div class="order-field"><label>Возраст ребёнка</label><input type="text" name="childAge" placeholder="Например, 2 года" required /></div>
        <div class="order-field"><label>Что важно обсудить</label><input type="text" name="comment" placeholder="Питание, адаптация, документы или другой вопрос" /></div>
      </form>
    </div>

    <div class="order-spacer"></div>
  </div>

  <!-- Submit bar -->
  <div class="order-submit-bar">
    <button type="submit" form="orderForm" class="order-submit-btn" id="orderSubmitBtn">
      <span class="order-submit-title">Отправить заявку</span>
      <span class="order-submit-subtitle" id="orderSubmitSubtitle">0 сом</span>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
